name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to publish the APK as a GitHub Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Test
        run: flutter test

      # The permanent upload key, from repository secrets. Without them the
      # APK is signed with a temporary debug key (Google sign-in won't work).
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SANADI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sanadi-upload.jks"
            echo "SANADI_KEYSTORE=$RUNNER_TEMP/sanadi-upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the Sanadi upload key"
          else
            echo "::warning::SANADI_KEYSTORE_B64 secret not set: signing with a temporary debug key"
          fi

      # Firebase settings come from repository variables (they are not secret;
      # every Android app ships them). Without them the app runs in demo mode.
      - name: Build APK
        env:
          SANADI_KEYSTORE_PASSWORD: ${{ secrets.SANADI_KEYSTORE_PASSWORD }}
          SANADI_KEY_ALIAS: sanadi
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=TURN_URLS=${{ vars.TURN_URLS }}
          --dart-define=TURN_USERNAME=${{ vars.TURN_USERNAME }}
          --dart-define=TURN_CREDENTIAL=${{ secrets.TURN_CREDENTIAL }}

      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "sanadi-build-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanadi-apk
          path: sanadi-build-${{ github.run_number }}.apk
          retention-days: 30

      # Every successful build of main becomes a release, so the newest APK
      # is always one tap away at /releases/latest on a phone. Other branches
      # only keep the APK as a workflow artifact, so they never take "latest".
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Test build ${{ github.run_number }}
          body: |
            Test build from `${{ github.ref_name }}` at ${{ github.sha }}.

            **Install on Android:** tap `sanadi-build-${{ github.run_number }}.apk` below, open it, and tap Install.
            Allow "Install unknown apps" if asked; if Play Protect warns, tap More details → Install anyway.
          files: sanadi-build-${{ github.run_number }}.apk
          make_latest: true
