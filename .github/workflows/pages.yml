name: Website

# Publishes site/ (privacy policy, terms, account deletion, and the admin
# portal under /admin/) to GitHub Pages. Needs Pages enabled once with "Source:
# GitHub Actions" in the repository settings.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The admin portal's Firebase settings (public values: access is
      # controlled by the Firestore rules, not by keeping these secret).
      - name: Admin portal settings
        env:
          API_KEY: ${{ vars.FIREBASE_API_KEY }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
        run: |
          cat > site/admin/config.js <<EOF
          export const firebaseConfig = {
            apiKey: '$API_KEY',
            authDomain: '$PROJECT_ID.firebaseapp.com',
            projectId: '$PROJECT_ID',
            messagingSenderId: '$SENDER_ID',
            appId: '$WEB_APP_ID',
          };
          export const emulatorUser = null;
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
