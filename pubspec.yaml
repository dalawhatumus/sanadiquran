name: sanadi
description: "Sanadi - Quran memorisation with volunteer teachers"
publish_to: 'none'
version: 0.8.1+13

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.3.0
  flutter_svg: ^2.0.10
  permission_handler: ^12.0.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  flutter_webrtc: ^1.6.2+hotfix.4
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/logo/
    - assets/quran/hafs.json
    - assets/quran/layout.json
    - assets/quran/line_widths.json
    - assets/avatars/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: KFGQPC
      fonts:
        - asset: assets/fonts/quran/UthmanicHafs1Ver18.ttf
